name: UI Tests (Cypress)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      use_cache:
        description: "Cache de dependências (true = execução a quente, false = a frio)"
        type: choice
        options: ["true", "false"]
        default: "true"

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Info da máquina
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          nproc
          free -m
          df -h /
          lscpu | grep -E "Model name|^CPU\(s\)" || true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ inputs.use_cache != 'false' && 'npm' || '' }}

      # binário do Cypress (fica fora do node_modules)
      - name: Cache do binário do Cypress
        if: ${{ inputs.use_cache != 'false' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes (medido)
        uses: lipesilvapr/tcc-metricas/.github/actions/measure@main
        with:
          projeto: cypress
          camada: ui
          command: |
            npx cypress run --browser chrome --config retries=0 \
              --reporter junit --reporter-options "mochaFile=cypress/results/junit-[hash].xml,toConsole=false"
          junit-glob: cypress/results/*.xml
          expected-tests: "10"
          cache: ${{ inputs.use_cache || 'true' }}
          threads: "1"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-results
          path: cypress/results
          if-no-files-found: ignore

      # o Allure CLI precisa de Java (já disponível no runner)
      - name: Gerar relatório Allure
        if: always()
        run: npm run allure:generate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore
