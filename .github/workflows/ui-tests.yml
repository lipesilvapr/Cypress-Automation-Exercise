name: UI Tests (Cypress)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Info da máquina
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          nproc
          free -m
          df -h /
          lscpu | grep -E "Model name|^CPU\(s\)" || true

      - uses: actions/checkout@v4

      - uses: cypress-io/github-action@v6
        with:
          browser: chrome
          install-command: npm install
          # retries desligados durante a medição, para a instabilidade aparecer nos dados
          config: retries=0

      # o Allure CLI precisa de Java (já disponível no runner)
      - name: Gerar relatório Allure
        if: always()
        run: npm run allure:generate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore
